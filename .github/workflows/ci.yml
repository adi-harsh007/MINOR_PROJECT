name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: the GPU wheels are ~2.5 GB and nothing here needs CUDA.
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check backend tests scripts

      - name: Run tests
        # models/latest.pt is 41 MB and gitignored, so a clean clone does not
        # have it. Tests that need to run inference skip themselves; everything
        # else - upload validation, storage, the OOD statistics, admin guards,
        # observability - runs here.
        run: python -m pytest -v

      - name: Confirm the app boots without a checkpoint
        # A missing model must surface on the first analysis, not at import, so
        # the process is expected to start cleanly and report itself degraded.
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from backend.main import app
          with TestClient(app) as c:
              body = c.get('/api/health').json()
              assert body['status'] == 'ok', body
              print('degraded:', body['degraded'])
          "
